name: Check AI rule updates
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ai-rule-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate stable rules and offline tests
        run: |
          python3 tools/ai_rules.py validate
          python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Check upstream candidates
        run: python3 tools/check_ai_updates.py
      - name: Verify stable list untouched
        if: always()
        run: git diff --exit-code -- rules/AI.list rules/AI.review.json
